<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshCoat Laundry - Contact Us</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <nav>
    <div class="container">
      <div class="logo"><i class="fas fa-soap"></i> FreshCoat</div>
      <ul class="nav-links">
        <li><a href="/home">Home</a></li>
        <li><a href="/about">About Us</a></li>
        <li><a href="/contact" class="active">Contact Us</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section class="contact-section">
      <div class="container">
        <h1>Get In Touch</h1>
        <div class="contact-wrapper">
          <div class="contact-form">
            <form action="#" method="post">
              <label for="name">Full Name</label>
              <input type="text" id="name" name="name" placeholder="Enter your name" required>

              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="Enter your email" required>

              <label for="message">Message</label>
              <textarea id="message" name="message" placeholder="Tell us how we can help..." required></textarea>

              <button type="submit">Send Message</button>
            </form>
          </div>
          <div class="contact-info">
            <h3>Contact Information</h3>
            <p><i class="fas fa-map-marker-alt"></i> 123 Laundry St, Clean City</p>
            <p><i class="fas fa-phone"></i> +1 (555) 123-4567</p>
            <p><i class="fas fa-envelope"></i> hello@freshcoat.com</p>
            <p><i class="fas fa-clock"></i> Mon - Sat: 8:00 AM - 8:00 PM</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 FreshCoat Laundry Services. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
